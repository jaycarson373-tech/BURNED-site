name: Verify Topblast Robinhood

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
